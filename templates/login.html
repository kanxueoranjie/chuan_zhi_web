<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 2603 班</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #1e2a44 0%, #16324f 60%, #1b3b5c 100%);
  }
  .card {
    width: min(390px, 100%);
    background: #fff;
    border-radius: 18px;
    padding: 38px 34px 30px;
    box-shadow: 0 22px 64px rgba(0,0,0,.38);
  }
  .brand {
    width: 52px; height: 52px;
    margin: 0 auto 16px;
    display: grid; place-items: center;
    border-radius: 14px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff; font-size: 24px;
    box-shadow: 0 8px 22px rgba(59,130,246,.42);
  }
  h1 { font-size: 21px; color: #1e2a44; text-align: center; letter-spacing: .5px; }
  .sub { text-align: center; color: #8a94a6; font-size: 13px; margin: 8px 0 26px; }
  .err {
    background: #fef2f2; color: #dc2626;
    border: 1px solid #fecaca; border-radius: 9px;
    padding: 10px 12px; font-size: 13.5px;
    margin-bottom: 18px; text-align: center;
  }
  label { display: block; font-size: 13px; color: #5a6a82; margin-bottom: 6px; font-weight: 600; }
  .field { position: relative; margin-bottom: 17px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d7dfeb;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    color: #1e2a44;
    outline: none;
    background: #fbfcfe;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .eye {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    border: 0; border-radius: 8px;
    background: transparent; color: #9aa6b8;
    font-size: 16px; cursor: pointer;
    transition: background .2s;
  }
  .eye:hover { background: #eef2f8; }
  button.submit {
    width: 100%; padding: 13px;
    border: 0; border-radius: 10px;
    background: #3b82f6; color: #fff;
    font-size: 15px; font-family: inherit;
    font-weight: 600; letter-spacing: 1px;
    cursor: pointer; margin-top: 6px;
    transition: background .2s, box-shadow .2s;
  }
  button.submit:hover { background: #2563eb; box-shadow: 0 8px 22px rgba(59,130,246,.42); }
  button.submit:disabled { background: #a9b8cc; cursor: not-allowed; box-shadow: none; }
  .tip { text-align: center; font-size: 12.5px; color: #a2abba; margin-top: 20px; line-height: 1.7; }
  .tip code { background: #eef2f8; color: #476189; padding: 2px 7px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>

<form class="card" method="POST" action="/login">
  <div class="brand">◆</div>
  <h1>班级管理系统</h1>
  <p class="sub">2603 班 · 请使用账号登录</p>

  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

  <label for="username">账号</label>
  <div class="field">
    <input id="username" name="username" type="text"
           placeholder="学号 或 管理员账号"
           value="{{ username or '' }}"
           autocomplete="username" required autofocus>
  </div>

  <label for="password">密码</label>
  <div class="field">
    <input id="password" name="password" type="password"
           placeholder="请输入密码" autocomplete="current-password" required>
    <button type="button" class="eye" id="eyeBtn" title="显示/隐藏密码">👁</button>
  </div>

  <button type="submit" class="submit" id="submitBtn">登 录</button>

  <p class="tip">
    学生：学号 + 初始密码 <code>123456</code><br>
    管理员请使用专用账号登录
  </p>
</form>

<script>
  var pwd = document.getElementById("password");
  var eye = document.getElementById("eyeBtn");
  eye.addEventListener("click", function () {
    var isPwd = pwd.type === "password";
    pwd.type = isPwd ? "text" : "password";
    eye.textContent = isPwd ? "🙈" : "👁";
    pwd.focus();
  });
  document.querySelector("form").addEventListener("submit", function () {
    var btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "登录中…";
  });
</script>

</body>
</html>

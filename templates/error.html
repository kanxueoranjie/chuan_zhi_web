<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code }} · 2603 班</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: linear-gradient(160deg, #eef2f7 0%, #e6edf6 100%);
    color: #1e2a44;
  }

  .card {
    width: min(440px, 100%);
    background: #fff;
    border-radius: 18px;
    padding: 44px 34px;
    text-align: center;
    box-shadow: 0 10px 34px rgba(15, 30, 60, .12);
  }

  .code {
    font-size: 62px;
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
  }

  .msg {
    font-size: 15px;
    color: #6b7788;
    line-height: 1.8;
    margin-bottom: 28px;
  }

  .btn {
    display: inline-block;
    padding: 11px 30px;
    border-radius: 10px;
    background: #3b82f6;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: background .2s;
  }
  .btn:hover { background: #2f6fd6; }

  .hint {
    margin-top: 22px;
    font-size: 12px;
    color: #a9b2c1;
  }
</style>
</head>
<body>

<div class="card">
  <div class="code">{{ code }}</div>
  <div class="msg">{{ msg }}</div>
  <a class="btn" href="{{ url_for('index') }}">回到工作台</a>
  <div class="hint">2603 班 · 班级管理系统</div>
</div>

</body>
</html>
